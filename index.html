<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Electronics Mukerian | Official Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #030303;
            --surface: #0a0a0c;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
            --silver-gradient: linear-gradient(90deg, #444, #fff, #aaa, #fff, #444);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--accent); overflow-x: hidden; scroll-behavior: smooth; }

        /* Background Animation */
        .ambient-engine {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at 50% 50%, #080808 0%, #000 100%);
        }
        .glow-blob {
            position: absolute; width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
            border-radius: 50%; animation: float 22s infinite alternate ease-in-out;
        }
        @keyframes float { 0% { transform: translate(-10%, -10%); } 100% { transform: translate(15%, 10%); } }

        /* Navigation & Logo */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 18px 6%; background: rgba(3, 3, 3, 0.8);
            backdrop-filter: blur(30px); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { 
            font-weight: 800; font-size: 1.3rem; letter-spacing: -0.8px;
            background: var(--silver-gradient); background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: silverShine 4s linear infinite;
        }
        @keyframes silverShine { to { background-position: 200% center; } }

        .search-area { width: 35%; position: relative; }
        .search-area input {
            width: 100%; background: var(--glass); border: 1px solid var(--border);
            padding: 12px 20px 12px 48px; border-radius: 16px; color: #fff;
            transition: 0.4s; font-size: 0.9rem; outline: none;
        }
        .search-area i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #555; }

        /* Category Rails */
        main { padding: 130px 0 80px; }
        .section-block { margin-bottom: 70px; padding-left: 6%; animation: reveal 0.8s ease-out; }
        @keyframes reveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .title-row { display: flex; justify-content: space-between; align-items: center; padding-right: 6%; margin-bottom: 25px; }
        .title-row h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }
        .rail-nav { display: flex; gap: 10px; }
        .nav-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .nav-btn:hover { background: #fff; color: #000; }

        .product-rail {
            display: flex; overflow-x: auto; gap: 28px; padding-bottom: 20px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .product-rail::-webkit-scrollbar { display: none; }

        /* Product Card */
        .card {
            min-width: 320px; max-width: 320px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 30px; padding: 25px;
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card:hover { transform: translateY(-10px); border-color: #555; }
        
        .img-wrap {
            width: 100%; height: 230px; background: #000;
            border-radius: 22px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .img-wrap img { max-width: 85%; max-height: 85%; object-fit: contain; }

        .price-text { font-size: 1.6rem; font-weight: 800; margin: 15px 0 25px; }
        
        .wa-btn {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            background: var(--accent); color: #000; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* Management Portal */
        #portal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; padding: 60px 5%; display: none; overflow-y: auto;
        }
        .portal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 1200px; margin: 0 auto; }
        .form-card { background: #0d0d0f; padding: 35px; border-radius: 24px; border: 1px solid #222; }
        .form-card h3 { margin-bottom: 25px; font-weight: 800; }
        input, select { width: 100%; padding: 16px; margin-bottom: 15px; background: #1a1a1c; border: 1px solid #333; color: #fff; border-radius: 12px; outline: none; }
        .sync-btn { width: 100%; padding: 18px; background: #fff; color: #000; font-weight: 800; border-radius: 14px; border: none; cursor: pointer; }

        footer { padding: 80px 6% 40px; text-align: center; border-top: 1px solid var(--border); }
        .signature { font-size: 0.8rem; font-weight: 800; letter-spacing: 4px; color: #333; text-transform: uppercase; }

        @media (max-width: 900px) { .portal-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="ambient-engine"><div class="glow-blob"></div></div>

    <nav>
        <div class="logo">VIJAY <span>ELECTRONICS</span></div>
        <div class="search-area">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="storeSearch" placeholder="Search products..." onkeyup="runFilter()">
        </div>
        <button style="background:none; border:1px solid #222; color:#555; padding:10px 18px; border-radius:12px; font-weight:800; cursor:pointer;" onclick="openPortal()">STAFF</button>
    </nav>

    <main id="catalogDisplay"></main>

    <footer>
        <div class="signature">@vijayelectronicsonline</div>
        <p style="color: #1a1a1a; font-size: 0.7rem; margin-top: 8px;">Railway Road, Mukerian • Authorized Retailer</p>
    </footer>

    <div id="portal">
        <div style="max-width: 1200px; margin: 0 auto 40px; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="font-weight: 800;">Business Management</h1>
            <i class="ph ph-x-circle" onclick="closePortal()" style="font-size: 2.5rem; cursor: pointer; color: #444;"></i>
        </div>

        <div class="portal-grid">
            <div class="form-card">
                <h3>Manage Categories</h3>
                <input type="text" id="newCatName" placeholder="Category Name (e.g. Smart LED TVs)">
                <button class="sync-btn" onclick="addCategory()">Create Category</button>
                <div id="catAdminList" style="margin-top: 25px; max-height: 200px; overflow-y: auto;"></div>
            </div>

            <div class="form-card">
                <h3>Add New Product</h3>
                <input type="text" id="pName" placeholder="Product Model Name">
                <select id="pCatSelect"><option value="">Select Category</option></select>
                <input type="number" id="pPrice" placeholder="Selling Price (₹)">
                <input type="file" id="pFile" accept="image/*">
                <button class="sync-btn" onclick="syncProduct()">Publish Product</button>
            </div>
        </div>

        <div class="form-card" style="margin-top: 40px; grid-column: span 2;">
            <h3>Live Product Inventory</h3>
            <div id="quickProductList"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAjhi25Q8urRDAS33nxMl3J3PCh8u8-b64",
            authDomain: "igelectrons.firebaseapp.com",
            projectId: "igelectrons",
            databaseURL: "https://igelectrons-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let masterCatalog = [];
        let categories = [];

        // 1. Listen for Categories
        database.ref('categories').on('value', snap => {
            const data = snap.val();
            categories = [];
            for (let id in data) categories.push({ id, ...data[id] });
            updateCatDropdown();
            renderCatList();
        });

        // 2. Listen for Products
        database.ref('inventory').on('value', snap => {
            const val = snap.val();
            masterCatalog = [];
            for (let id in val) masterCatalog.push({ id, ...val[id] });
            renderStore();
            refreshProductList();
        });

        function renderStore() {
            const display = document.getElementById('catalogDisplay');
            if (categories.length === 0) {
                display.innerHTML = '<p style="text-align:center; color:#444;">No categories created yet.</p>';
                return;
            }

            display.innerHTML = categories.map(cat => {
                const filtered = masterCatalog.filter(i => i.cat === cat.name);
                if (filtered.length === 0) return ''; // Don't show empty categories
                const rid = cat.id;
                return `
                    <section class="section-block">
                        <div class="title-row">
                            <h2>${cat.name}</h2>
                            <div class="rail-nav">
                                <div class="nav-btn" onclick="moveRail('${rid}', -400)"><i class="ph ph-caret-left"></i></div>
                                <div class="nav-btn" onclick="moveRail('${rid}', 400)"><i class="ph ph-caret-right"></i></div>
                            </div>
                        </div>
                        <div class="product-rail" id="r-${rid}">
                            ${filtered.map(item => `
                                <div class="card">
                                    <div class="img-wrap"><img src="${item.img}"></div>
                                    <h3 style="font-size:1.1rem; min-height: 2.4rem;">${item.name}</h3>
                                    <div class="price-text">₹${parseInt(item.price).toLocaleString('en-IN')}</div>
                                    <button class="wa-btn" onclick="order('${item.name}')">
                                        <i class="ph-fill ph-whatsapp-logo" style="color:#25D366; font-size:1.4rem;"></i> ORDER INQUIRY
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }).join('');
        }

        // --- Logic Handlers ---
        function moveRail(id, v) { document.getElementById('r-'+id).scrollBy({ left: v, behavior: 'smooth' }); }
        
        function order(n) {
            window.open(`https://wa.me/919876898832?text=${encodeURIComponent(`Hi, I'm interested in the ${n}.`)}`, '_blank');
        }

        function openPortal() { if(prompt("Security PIN:") === "ig99") document.getElementById('portal').style.display = 'block'; }
        function closePortal() { document.getElementById('portal').style.display = 'none'; }

        // Category Logic
        function addCategory() {
            const name = document.getElementById('newCatName').value;
            if(!name) return;
            database.ref('categories').push({ name });
            document.getElementById('newCatName').value = '';
        }

        function updateCatDropdown() {
            const select = document.getElementById('pCatSelect');
            select.innerHTML = '<option value="">Select Category</option>' + 
                categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        function renderCatList() {
            document.getElementById('catAdminList').innerHTML = categories.map(c => `
                <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #222;">
                    <span>${c.name}</span>
                    <i class="ph ph-trash" style="color:red; cursor:pointer;" onclick="database.ref('categories/${c.id}').remove()"></i>
                </div>
            `).join('');
        }

        // Product Logic
        function syncProduct() {
            const f = document.getElementById('pFile').files[0];
            const name = document.getElementById('pName').value;
            const cat = document.getElementById('pCatSelect').value;
            const price = document.getElementById('pPrice').value;
            
            if(!f || !name || !cat || !price) return alert("Fill all fields");
            
            const r = new FileReader();
            r.onloadend = () => {
                database.ref('inventory').push({ name, cat, price, img: r.result })
                .then(() => { alert("Published!"); document.getElementById('pName').value = ''; });
            };
            r.readAsDataURL(f);
        }

        function refreshProductList() {
            document.getElementById('quickProductList').innerHTML = masterCatalog.map(i => `
                <div style="display:flex; justify-content:space-between; padding:12px; background:#1a1a1c; border-radius:10px; margin-bottom:8px;">
                    <span>${i.name} <small style="color:#555">(${i.cat})</small></span>
                    <i class="ph ph-trash" style="color:red; cursor:pointer;" onclick="database.ref('inventory/${i.id}').remove()"></i>
                </div>
            `).join('');
        }

        function runFilter() {
            const q = document.getElementById('storeSearch').value.toLowerCase();
            const filtered = masterCatalog.filter(i => i.name.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));
            // Basic search render
            if(q === "") return renderStore();
            document.getElementById('catalogDisplay').innerHTML = `
                <section class="section-block">
                    <h2>Search Results</h2>
                    <div class="product-rail" style="flex-wrap: wrap;">
                        ${filtered.map(item => `<div class="card">${item.name}</div>`).join('')}
                    </div>
                </section>`;
        }
    </script>
</body>
</html>
