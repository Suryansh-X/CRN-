<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Electronics Mukerian | Premium Home Appliances</title>
    
    <meta name="description" content="Vijay Electronics Mukerian - The leading showroom for ACs, Geysers, Coolers, and Washing Machines on Railway Road. Premium electronics at competitive prices.">
    <meta name="keywords" content="Vijay electronics, Mukerian, Mukerian electronics, appliances, geyser, ac, Cooler, washing machine, refrigerator, LED TV, home electronics Mukerian, Punjab electronics">
    <meta name="author" content="Vijay Electronics">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #030303;
            --surface: #0a0a0b;
            --accent: #ffffff;
            --text-dim: #818181;
            --border: rgba(255, 255, 255, 0.05);
            --wa-green: #25D366;
            --glow: rgba(99, 102, 241, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--accent); overflow-x: hidden; line-height: 1.6; -webkit-font-smoothing: antialiased; }

        /* Dynamic Background */
        .glow-sphere {
            position: fixed; top: -15%; right: -10%; width: 70vw; height: 70vw;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        /* Navigation */
        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1200px; z-index: 1000;
            background: rgba(10, 10, 11, 0.75); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 14px 35px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px; text-transform: uppercase; cursor: default; }
        .logo span { font-weight: 200; color: var(--text-dim); }
        .staff-btn { background: var(--accent); color: #000; padding: 9px 20px; border-radius: 14px; font-size: 0.75rem; font-weight: 800; cursor: pointer; transition: 0.3s; border: none; }
        .staff-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }

        /* Hero Section */
        .hero { padding: 220px 5% 40px; text-align: center; }
        .location-tag { color: var(--text-dim); text-transform: uppercase; letter-spacing: 5px; font-size: 0.7rem; font-weight: 800; margin-bottom: 20px; display: block; }
        .hero h1 { font-size: clamp(2.5rem, 9vw, 5rem); font-weight: 800; letter-spacing: -4px; line-height: 0.95; margin-bottom: 35px; }
        
        .search-area { max-width: 650px; margin: 40px auto; position: relative; }
        .search-area input {
            width: 100%; background: var(--surface); border: 1px solid var(--border);
            padding: 24px 30px 24px 65px; border-radius: 35px; color: #fff;
            font-size: 1.1rem; outline: none; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-area input:focus { border-color: #666; background: #0e0e0f; }
        .search-area i { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); color: #444; font-size: 1.4rem; }

        .tag-cloud { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; max-width: 850px; margin: 0 auto 80px; }
        .tag { font-size: 0.65rem; background: var(--surface); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; cursor: default; }

        /* Showcase Grid */
        .showcase { padding: 20px 5% 150px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 45px; }
        .item-card { background: var(--surface); border-radius: 45px; border: 1px solid var(--border); padding: 35px; transition: 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); display: flex; flex-direction: column; }
        .item-card:hover { transform: translateY(-15px); border-color: #333; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }

        .media-box { height: 280px; background: #000; border-radius: 35px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; overflow: hidden; position: relative; }
        .media-box img { max-width: 80%; max-height: 80%; object-fit: contain; transition: 0.5s; }
        .item-card:hover .media-box img { transform: scale(1.08); }

        .item-cat { font-size: 0.65rem; color: var(--text-dim); font-weight: 800; text-transform: uppercase; letter-spacing: 2.5px; margin-bottom: 12px; }
        .item-card h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 15px; letter-spacing: -0.5px; }
        .item-price { font-size: 2rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1px; }
        
        .wa-inquiry {
            background: var(--accent); color: #000; padding: 22px; border-radius: 24px;
            text-align: center; text-decoration: none; font-weight: 800; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.3s;
        }
        .wa-inquiry:hover { background: var(--wa-green); color: #fff; }

        /* Admin Management Panel */
        #dashPanel {
            position: fixed; top: 0; right: -100%; width: 500px; height: 100%;
            background: #000; z-index: 2000; padding: 60px 40px;
            transition: 0.7s cubic-bezier(0.8, 0, 0.2, 1); border-left: 1px solid #222; overflow-y: auto;
        }
        #dashPanel.open { right: 0; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; }
        .dash-header h2 { font-weight: 800; letter-spacing: -1px; }
        .dash-header i { cursor: pointer; font-size: 1.8rem; color: #444; transition: 0.3s; }
        .dash-header i:hover { color: #fff; }

        .form-row label { display: block; font-size: 0.7rem; font-weight: 800; color: #444; text-transform: uppercase; margin-bottom: 8px; margin-left: 5px; }
        .form-row input, .form-row select, .form-row textarea { width: 100%; background: #0a0a0b; border: 1px solid #222; padding: 18px; border-radius: 16px; color: #fff; margin-bottom: 20px; outline: none; font-size: 0.9rem; }
        .form-row input:focus { border-color: #555; }
        .commit-btn { width: 100%; padding: 22px; border-radius: 22px; border: none; background: #fff; color: #000; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .commit-btn:hover { opacity: 0.9; }

        .mini-list-title { margin-top: 60px; font-size: 0.7rem; font-weight: 800; color: #444; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
        .mini-item { background: #0a0a0b; border: 1px solid #111; padding: 20px; border-radius: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .mini-item span { font-size: 0.85rem; font-weight: 600; }
        .mini-item div i { cursor: pointer; font-size: 1.2rem; transition: 0.3s; }

        #bgAmbient { display: none; }

        @media (max-width: 600px) {
            #dashPanel { width: 100%; }
            .hero { padding-top: 180px; }
        }
    </style>
</head>
<body>

    <div class="glow-sphere"></div>
    <audio id="bgAmbient" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <nav>
        <div class="logo">VIJAY <span>ELECTRONICS</span></div>
        <button class="staff-btn" onclick="openDash()">PORTAL</button>
    </nav>

    <section class="hero">
        <span class="location-tag">Railway Road, Mukerian</span>
        <h1>Sophisticated Living.</h1>
        <div class="search-area">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="pSearch" placeholder="Search premium appliances..." onkeyup="handleSearch()">
        </div>
        <div class="tag-cloud">
            <div class="tag">Vijay Electronics</div>
            <div class="tag">Mukerian Electronics</div>
            <div class="tag">Air Conditioning</div>
            <div class="tag">Symphony Coolers</div>
            <div class="tag">Smart Geysers</div>
            <div class="tag">Washing Machines</div>
        </div>
    </section>

    <main class="showcase">
        <div id="pGrid" class="grid">
            </div>
    </main>

    <div id="dashPanel">
        <div class="dash-header">
            <h2>Inventory</h2> 
            <i class="ph ph-x-circle" onclick="closeDash()"></i>
        </div>
        
        <div class="form-row">
            <input type="hidden" id="editKey">
            
            <label>Full Product Name</label>
            <input type="text" id="nameIn" placeholder="e.g. Samsung 7kg Front Load">
            
            <label>Product Category</label>
            <select id="catIn">
                <option value="AC">Air Conditioner</option>
                <option value="Cooler">Air Cooler</option>
                <option value="Geyser">Geyser</option>
                <option value="Washing Machine">Washing Machine</option>
                <option value="Refrigerator">Refrigerator</option>
                <option value="LED TV">LED TV</option>
                <option value="Other">Other Home Appliances</option>
            </select>
            
            <label>Price (INR)</label>
            <input type="number" id="priceIn" placeholder="Amount in ₹">
            
            <label>Specifications</label>
            <textarea id="descIn" placeholder="Highlights of the product..." rows="3"></textarea>
            
            <label>Product Image</label>
            <input type="file" id="imgIn" accept="image/*">
            
            <button class="commit-btn" onclick="commitData()">Synchronize Live Showcase</button>
        </div>

        <div class="mini-list-title">Live Inventory Management</div>
        <div id="miniList"></div>
    </div>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
            apiKey: "AIzaSyAjhi25Q8urRDAS33nxMl3J3PCh8u8-b64",
            authDomain: "igelectrons.firebaseapp.com",
            projectId: "igelectrons",
            databaseURL: "https://igelectrons-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // AMBIENT AUDIO LOGIC
        const amb = document.getElementById('bgAmbient');
        const initAudio = () => {
            amb.play().catch(() => {});
            document.removeEventListener('mousedown', initAudio);
            document.removeEventListener('touchstart', initAudio);
        };
        document.addEventListener('mousedown', initAudio);
        document.addEventListener('touchstart', initAudio);

        let catalog = [];

        // REAL-TIME DATABASE SYNC
        db.ref('inventory').on('value', snap => {
            const val = snap.val();
            catalog = [];
            for (let key in val) {
                catalog.push({ id: key, ...val[key] });
            }
            renderShowcase(catalog);
            renderDashList();
        });

        function renderShowcase(data) {
            const grid = document.getElementById('pGrid');
            grid.innerHTML = data.map(p => {
                const message = `Hi Vijay Electronics Mukerian, I'm interested in the ${p.name}. Please provide more details.`;
                const waLink = `https://wa.me/919876898832?text=${encodeURIComponent(message)}`;
                return `
                    <article class="item-card">
                        <div class="media-box"><img src="${p.img}" alt="${p.name}"></div>
                        <div class="item-cat">${p.cat}</div>
                        <h3>${p.name}</h3>
                        <div class="item-price">₹${parseInt(p.price).toLocaleString('en-IN')}</div>
                        <a href="${waLink}" target="_blank" class="wa-inquiry">
                            <i class="ph-fill ph-whatsapp-logo" style="font-size:1.5rem"></i> CONNECT VIA WHATSAPP
                        </a>
                    </article>
                `;
            }).join('');
        }

        // PORTAL MANAGEMENT
        function openDash() {
            if(prompt("Enter Management PIN:") === "ig99") {
                document.getElementById('dashPanel').classList.add('open');
            }
        }
        function closeDash() { document.getElementById('dashPanel').classList.remove('open'); }

        function commitData() {
            const id = document.getElementById('editKey').value;
            const file = document.getElementById('imgIn').files[0];
            
            const pushUpdate = (imgUri = null) => {
                const entry = {
                    name: document.getElementById('nameIn').value,
                    cat: document.getElementById('catIn').value,
                    price: document.getElementById('priceIn').value,
                    desc: document.getElementById('descIn').value
                };
                if(imgUri) entry.img = imgUri;

                if(id) {
                    db.ref('inventory/' + id).update(entry);
                } else {
                    db.ref('inventory').push(entry);
                }
                alert("Showcase Synchronized.");
                resetForm();
            };

            if(file) {
                const reader = new FileReader();
                reader.onloadend = () => pushUpdate(reader.result);
                reader.readAsDataURL(file);
            } else {
                pushUpdate();
            }
        }

        function renderDashList() {
            document.getElementById('miniList').innerHTML = catalog.map(p => `
                <div class="mini-item">
                    <span>${p.name}</span>
                    <div>
                        <i class="ph ph-pencil-simple" onclick="loadItem('${p.id}')" style="margin-right:15px; color:#555;"></i>
                        <i class="ph ph-trash-simple" onclick="deleteItem('${p.id}')" style="color:#ff4444;"></i>
                    </div>
                </div>
            `).join('');
        }

        function loadItem(id) {
            const p = catalog.find(x => x.id === id);
            document.getElementById('editKey').value = p.id;
            document.getElementById('nameIn').value = p.name;
            document.getElementById('catIn').value = p.cat;
            document.getElementById('priceIn').value = p.price;
            document.getElementById('descIn').value = p.desc;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteItem(id) {
            if(confirm("Permanently remove this product from the live catalog?")) {
                db.ref('inventory/' + id).remove();
            }
        }

        function resetForm() {
            ['editKey','nameIn','priceIn','descIn','imgIn'].forEach(id => document.getElementById(id).value = '');
        }

        function handleSearch() {
            const term = document.getElementById('pSearch').value.toLowerCase();
            renderShowcase(catalog.filter(p => 
                p.name.toLowerCase().includes(term) || 
                p.cat.toLowerCase().includes(term)
            ));
        }
    </script>
</body>
</html>
