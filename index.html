<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Electronics Mukerian | Premium Home Appliances</title>
    
    <meta name="description" content="Shop premium ACs, Washing Machines, and Home Appliances at Vijay Electronics Mukerian. Experience authentic retail with local pickup and expert service on Railway Road.">
    <meta name="keywords" content="Vijay electronics, Mukerian, Mukerian electronics, appliances, geyser, ac, Cooler, washing machine, Mukerian shopping, Punjab electronics">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #030303;
            --surface: #0a0a0b;
            --accent: #ffffff;
            --text-dim: #818181;
            --border: rgba(255, 255, 255, 0.05);
            --wa-green: #25D366;
            --glow: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--accent); overflow-x: hidden; line-height: 1.6; -webkit-font-smoothing: antialiased; }

        /* AUTHENTIC UI COMPONENTS */
        .glow-sphere { position: fixed; top: -15%; right: -10%; width: 70vw; height: 70vw; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); z-index: -1; pointer-events: none; }

        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1200px; z-index: 1000;
            background: rgba(10, 10, 11, 0.8); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 12px 30px; display: flex; justify-content: space-between; align-items: center;
        }

        .logo { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px; text-transform: uppercase; cursor: pointer; }
        .logo span { font-weight: 200; color: var(--text-dim); }

        .nav-actions { display: flex; align-items: center; gap: 20px; }
        .cart-trigger { position: relative; cursor: pointer; font-size: 1.4rem; color: var(--accent); transition: 0.3s; }
        .cart-count { position: absolute; top: -5px; right: -8px; background: #fff; color: #000; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 10px; }
        .staff-portal-btn { background: #1a1a1a; color: #fff; padding: 8px 16px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; cursor: pointer; border: 1px solid var(--border); }

        /* HERO SECTION */
        .hero { padding: 200px 5% 40px; text-align: center; }
        .location-badge { color: var(--text-dim); text-transform: uppercase; letter-spacing: 5px; font-size: 0.65rem; font-weight: 800; margin-bottom: 20px; display: block; }
        .hero h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; letter-spacing: -3px; line-height: 1; margin-bottom: 30px; }

        /* PRODUCT DISPLAY */
        .showcase { padding: 20px 5% 150px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }

        .product-card { 
            background: var(--surface); border: 1px solid var(--border); border-radius: 35px; 
            padding: 30px; transition: 0.5s cubic-bezier(0.165, 0.84, 0.44, 1); display: flex; flex-direction: column;
        }
        .product-card:hover { transform: translateY(-10px); border-color: #333; }

        .image-container { height: 260px; background: #000; border-radius: 25px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; overflow: hidden; position: relative; }
        .image-container img { max-width: 80%; max-height: 80%; object-fit: contain; }

        .badge { position: absolute; top: 15px; left: 15px; background: #fff; color: #000; font-size: 0.6rem; font-weight: 800; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; }

        .product-info h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
        .product-price { font-size: 1.6rem; font-weight: 800; margin-bottom: 25px; color: #fff; }

        .add-to-cart { 
            background: var(--accent); color: #000; padding: 18px; border-radius: 20px; 
            border: none; font-weight: 800; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .add-to-cart:hover { opacity: 0.9; transform: scale(0.98); }

        /* SHOPPING CART OVERLAY */
        #cartSidebar {
            position: fixed; top: 0; right: -100%; width: 450px; height: 100%;
            background: #000; z-index: 2000; padding: 40px;
            transition: 0.6s cubic-bezier(0.8, 0, 0.2, 1); border-left: 1px solid #222;
            display: flex; flex-direction: column;
        }
        #cartSidebar.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin-bottom: 30px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #111; padding-bottom: 15px; }
        .checkout-btn { background: var(--wa-green); color: #fff; padding: 22px; border-radius: 20px; text-align: center; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }

        /* ADMIN DASHBOARD */
        #adminPanel { position: fixed; top: 0; left: -100%; width: 100%; height: 100%; background: #000; z-index: 3000; transition: 0.6s; padding: 40px; overflow-y: auto; }
        #adminPanel.open { left: 0; }
        .form-grid { max-width: 600px; margin: 0 auto; }
        .form-grid input, .form-grid select, .form-grid textarea { width: 100%; background: #111; border: 1px solid #222; padding: 15px; border-radius: 12px; color: #fff; margin-bottom: 15px; outline: none; }
        .admin-mini-item { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        #bgAmbient { display: none; }
        @media (max-width: 500px) { #cartSidebar { width: 100%; } }
    </style>
</head>
<body>

    <div class="glow-sphere"></div>
    <audio id="bgAmbient" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <nav>
        <div class="logo" onclick="location.reload()">VIJAY <span>ELECTRONICS</span></div>
        <div class="nav-actions">
            <div class="cart-trigger" onclick="toggleCart()">
                <i class="ph ph-shopping-bag"></i>
                <span id="cartCount" class="cart-count">0</span>
            </div>
            <div class="staff-portal-btn" onclick="openAdmin()">PORTAL</div>
        </div>
    </nav>

    <section class="hero">
        <span class="location-badge">Railway Road, Mukerian</span>
        <h1>Authentic Quality.</h1>
        <div style="max-width: 600px; margin: 0 auto;">
            <p style="color: var(--text-dim); margin-bottom: 40px; font-weight: 600;">Mukerian's trusted destination for premium Home Appliances. Experience authentic retail with direct showroom pricing.</p>
        </div>
    </section>

    <main class="showcase">
        <div id="pGrid" class="grid">
            </div>
    </main>

    <div id="cartSidebar">
        <div class="cart-header">
            <h2 style="font-weight: 800;">Your Cart</h2>
            <i class="ph ph-x" style="cursor:pointer; font-size: 1.5rem;" onclick="toggleCart()"></i>
        </div>
        <div id="cartItems" class="cart-items">
            </div>
        <div class="cart-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                <span style="color: var(--text-dim); font-weight: 600;">Subtotal</span>
                <span id="cartTotal" style="font-weight: 800; font-size: 1.2rem;">₹0</span>
            </div>
            <div onclick="checkout()" class="checkout-btn">
                <i class="ph-fill ph-whatsapp-logo"></i> COMPLETE ORDER
            </div>
        </div>
    </div>

    <div id="adminPanel">
        <div class="form-grid">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 40px;">
                <h1 style="font-weight: 800;">Management</h1>
                <i class="ph ph-x-circle" style="font-size: 2rem; cursor:pointer;" onclick="closeAdmin()"></i>
            </div>
            <input type="hidden" id="editKey">
            <input type="text" id="nameIn" placeholder="Product Title">
            <select id="catIn">
                <option value="AC">Air Conditioner</option>
                <option value="Cooler">Air Cooler</option>
                <option value="Geyser">Geyser</option>
                <option value="Washing Machine">Washing Machine</option>
                <option value="Refrigerator">Refrigerator</option>
                <option value="LED TV">LED TV</option>
            </select>
            <input type="number" id="priceIn" placeholder="Market Price (INR)">
            <textarea id="descIn" placeholder="Product Key Features..." rows="3"></textarea>
            <input type="file" id="imgIn" accept="image/*">
            <button onclick="saveProduct()" style="width:100%; background:#fff; color:#000; padding:20px; border-radius:15px; font-weight:800; border:none; cursor:pointer;">UPDATE LIVE CATALOG</button>
            
            <div style="margin-top: 50px;" id="adminList"></div>
        </div>
    </div>

    <script>
        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAjhi25Q8urRDAS33nxMl3J3PCh8u8-b64",
            authDomain: "igelectrons.firebaseapp.com",
            projectId: "igelectrons",
            databaseURL: "https://igelectrons-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let catalog = [];
        let cart = JSON.parse(localStorage.getItem('vj_cart')) || [];

        // AMBIENT SOUND
        const amb = document.getElementById('bgAmbient');
        const playSnd = () => { amb.play().catch(()=>{}); document.removeEventListener('click', playSnd); };
        document.addEventListener('click', playSnd);

        // DATA SYNC
        db.ref('inventory').on('value', snap => {
            const val = snap.val(); catalog = [];
            for (let key in val) catalog.push({ id: key, ...val[key] });
            renderUI();
            renderAdmin();
            updateCartUI();
        });

        function renderUI() {
            const grid = document.getElementById('pGrid');
            grid.innerHTML = catalog.map(p => `
                <div class="product-card">
                    <div class="image-container">
                        <span class="badge">In Stock</span>
                        <img src="${p.img}">
                    </div>
                    <div class="product-info">
                        <p style="font-size: 0.6rem; color: #555; text-transform: uppercase; font-weight: 800; letter-spacing: 2px;">${p.cat}</p>
                        <h3>${p.name}</h3>
                        <p class="product-price">₹${parseInt(p.price).toLocaleString('en-IN')}</p>
                        <button class="add-to-cart" onclick="addToCart('${p.id}')">
                            <i class="ph ph-plus-circle"></i> ADD TO BAG
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // CART LOGIC
        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('open'); }

        function addToCart(id) {
            const product = catalog.find(x => x.id === id);
            cart.push(product);
            localStorage.setItem('vj_cart', JSON.stringify(cart));
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            const list = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            const countEl = document.getElementById('cartCount');
            
            countEl.innerText = cart.length;
            let total = 0;

            list.innerHTML = cart.map((item, index) => {
                total += parseInt(item.price);
                return `
                    <div class="cart-item">
                        <div>
                            <p style="font-weight: 700; font-size: 0.9rem;">${item.name}</p>
                            <p style="font-size: 0.8rem; color: var(--text-dim);">₹${parseInt(item.price).toLocaleString('en-IN')}</p>
                        </div>
                        <i class="ph ph-trash" style="color: #ff4444; cursor:pointer;" onclick="removeFromCart(${index})"></i>
                    </div>
                `;
            }).join('');
            totalEl.innerText = `₹${total.toLocaleString('en-IN')}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('vj_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function checkout() {
            if (cart.length === 0) return alert("Your cart is empty.");
            let message = "*New Order Inquiry - Vijay Electronics Mukerian*\n\n";
            let total = 0;
            cart.forEach((item, i) => {
                message += `${i+1}. ${item.name} - ₹${item.price}\n`;
                total += parseInt(item.price);
            });
            message += `\n*Total Amount: ₹${total.toLocaleString('en-IN')}*`;
            window.open(`https://wa.me/919876898832?text=${encodeURIComponent(message)}`, '_blank');
        }

        // ADMIN LOGIC
        function openAdmin() { if(prompt("Management PIN:") === "ig99") document.getElementById('adminPanel').classList.add('open'); }
        function closeAdmin() { document.getElementById('adminPanel').classList.remove('open'); }

        function saveProduct() {
            const id = document.getElementById('editKey').value;
            const file = document.getElementById('imgIn').files[0];
            const execute = (uri = null) => {
                const data = {
                    name: document.getElementById('nameIn').value,
                    cat: document.getElementById('catIn').value,
                    price: document.getElementById('priceIn').value,
                    desc: document.getElementById('descIn').value
                };
                if(uri) data.img = uri;
                id ? db.ref('inventory/'+id).update(data) : db.ref('inventory').push(data);
                alert("Showroom Updated.");
                resetAdmin();
            };
            if(file) { const r = new FileReader(); r.onloadend = () => execute(r.result); r.readAsDataURL(file); } else execute();
        }

        function renderAdmin() {
            document.getElementById('adminList').innerHTML = catalog.map(p => `
                <div class="admin-mini-item">
                    <span>${p.name}</span>
                    <div>
                        <i class="ph ph-pencil" onclick="loadAdmin('${p.id}')" style="margin-right:15px; cursor:pointer; color:#666;"></i>
                        <i class="ph ph-trash" onclick="deleteProd('${p.id}')" style="color:#ff4444; cursor:pointer;"></i>
                    </div>
                </div>
            `).join('');
        }

        function loadAdmin(id) {
            const p = catalog.find(x => x.id === id);
            document.getElementById('editKey').value = p.id;
            document.getElementById('nameIn').value = p.name;
            document.getElementById('catIn').value = p.cat;
            document.getElementById('priceIn').value = p.price;
            document.getElementById('descIn').value = p.desc;
        }

        function deleteProd(id) { if(confirm("Delete item?")) db.ref('inventory/'+id).remove(); }
        function resetAdmin() { ['editKey','nameIn','priceIn','descIn','imgIn'].forEach(el => document.getElementById(el).value=''); }

    </script>
</body>
    </html>
