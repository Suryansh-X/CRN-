<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Electronics Mukerian | Official Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #030303;
            --surface: #0a0a0c;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--accent); overflow-x: hidden; scroll-behavior: smooth; }

        /* Animated Ambient Background */
        .ambient-engine {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at 50% 50%, #080808 0%, #000 100%);
        }
        .glow-blob {
            position: absolute; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
            border-radius: 50%; animation: float 15s infinite alternate ease-in-out;
        }
        @keyframes float { 0% { transform: translate(-10%, -10%); } 100% { transform: translate(15%, 5%); } }

        /* Shimmering Silver Logo */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 18px 6%; background: rgba(3, 3, 3, 0.85);
            backdrop-filter: blur(30px); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { 
            font-weight: 800; font-size: 1.3rem; letter-spacing: -0.8px;
            background: linear-gradient(90deg, #444, #fff, #aaa, #fff, #444);
            background-size: 200% auto; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; animation: silverShine 4s linear infinite;
        }
        @keyframes silverShine { to { background-position: 200% center; } }

        /* Search Bar */
        .search-container { width: 35%; position: relative; }
        .search-container input {
            width: 100%; background: var(--glass); border: 1px solid var(--border);
            padding: 12px 20px 12px 48px; border-radius: 16px; color: #fff;
            transition: 0.4s; font-size: 0.9rem; outline: none;
        }
        .search-container i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #555; }

        /* Main Store Sections */
        main { padding: 130px 0 80px; min-height: 80vh; }
        .section-block { margin-bottom: 60px; padding-left: 6%; }
        .title-row { display: flex; justify-content: space-between; align-items: center; padding-right: 6%; margin-bottom: 25px; }
        .title-row h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }
        
        /* Horizontal Product Rails */
        .product-rail {
            display: flex; overflow-x: auto; gap: 25px; padding-bottom: 25px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .product-rail::-webkit-scrollbar { display: none; }

        /* Product Cards */
        .card {
            min-width: 310px; max-width: 310px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 28px; padding: 22px;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card:hover { border-color: #555; transform: translateY(-8px); }
        .img-wrap {
            width: 100%; height: 220px; background: #000;
            border-radius: 20px; margin-bottom: 18px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .img-wrap img { max-width: 85%; max-height: 85%; object-fit: contain; }
        
        .price { font-size: 1.6rem; font-weight: 800; margin: 12px 0 20px; }
        .wa-btn {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: #fff; color: #000; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* Staff Portal Layout */
        #portal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; padding: 50px 5%; display: none; overflow-y: auto;
        }
        .portal-grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .m-card { background: #0d0d0f; padding: 30px; border-radius: 20px; border: 1px solid #222; }
        input, select { width: 100%; padding: 14px; margin-bottom: 12px; background: #1a1a1c; border: 1px solid #333; color: #fff; border-radius: 10px; outline: none; }
        .btn-p { width: 100%; padding: 15px; background: #fff; color: #000; font-weight: 800; border-radius: 10px; cursor: pointer; border: none; }

        footer { padding: 80px 0 40px; text-align: center; border-top: 1px solid var(--border); }
        .signature { font-size: 0.85rem; font-weight: 800; letter-spacing: 4px; color: #333; text-transform: uppercase; }

        @media (max-width: 800px) {
            .portal-grid { grid-template-columns: 1fr; }
            .search-container { display: none; }
        }
    </style>
</head>
<body>

    <div class="ambient-engine"><div class="glow-blob"></div></div>

    <nav>
        <div class="logo">VIJAY <span>ELECTRONICS</span></div>
        <div class="search-container">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="mainSearch" placeholder="Search brands or products..." onkeyup="filterStore()">
        </div>
        <button style="background:none; border:1px solid #333; color:#fff; padding:8px 16px; border-radius:10px; cursor:pointer; font-weight: 800; font-size: 0.7rem;" onclick="openPortal()">STAFF ACCESS</button>
    </nav>

    <main id="homeContainer">
        </main>

    <footer>
        <div class="signature">@vijayelectronicsonline</div>
        <p style="color: #1a1a1a; font-size: 0.7rem; margin-top: 10px;">Railway Road, Mukerian • Authorized Retailer</p>
    </footer>

    <div id="portal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; max-width:1100px; margin-left:auto; margin-right:auto;">
            <h1 style="font-weight: 800;">Store Management</h1>
            <i class="ph ph-x-circle" onclick="closePortal()" style="font-size:2.5rem; cursor:pointer; color: #444;"></i>
        </div>
        
        <div class="portal-grid">
            <div class="m-card">
                <h3>1. Manage Categories</h3>
                <input type="text" id="catName" placeholder="Category Name (e.g. Smart TV)">
                <button class="btn-p" onclick="saveCat()">Create Category</button>
                <div id="catList" style="margin-top:25px; max-height: 200px; overflow-y: auto;"></div>
            </div>

            <div class="m-card">
                <h3>2. Add Product</h3>
                <input type="text" id="pName" placeholder="Product Name">
                <select id="pCatSelect"><option value="">Select Category</option></select>
                <input type="number" id="pPrice" placeholder="Price (₹)">
                <input type="file" id="pImage" accept="image/*">
                <button class="btn-p" onclick="saveProduct()">Upload Product</button>
            </div>
        </div>

        <div class="m-card" style="margin-top:30px; max-width: 1100px; margin-left:auto; margin-right:auto;">
            <h3>Inventory Overview</h3>
            <div id="invList"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAjhi25Q8urRDAS33nxMl3J3PCh8u8-b64",
            authDomain: "igelectrons.firebaseapp.com",
            projectId: "igelectrons",
            databaseURL: "https://igelectrons-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let cats = [];
        let prods = [];

        // Real-time Data Syncing
        db.ref('categories').on('value', s => {
            const d = s.val(); cats = [];
            for(let id in d) cats.push({id, ...d[id]});
            renderAll();
        });

        db.ref('inventory').on('value', s => {
            const d = s.val(); prods = [];
            for(let id in d) prods.push({id, ...d[id]});
            renderAll();
        });

        function renderAll() {
            const container = document.getElementById('homeContainer');
            
            // 1. Render Storefront Home Page
            if(cats.length === 0 && prods.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:100px 0; color:#333;"><h3>Showroom Empty</h3><p>Use Staff Access to add categories and items.</p></div>`;
            } else {
                container.innerHTML = cats.map(c => {
                    const items = prods.filter(p => p.cat === c.name);
                    if(items.length === 0) return ''; // Skip empty categories on home
                    return `
                        <section class="section-block">
                            <div class="title-row"><h2>${c.name}</h2></div>
                            <div class="product-rail">
                                ${items.map(i => `
                                    <div class="card">
                                        <div class="img-wrap"><img src="${i.img}"></div>
                                        <h3 style="font-size:1.1rem; height:2.8rem; overflow:hidden;">${i.name}</h3>
                                        <div class="price">₹${parseInt(i.price).toLocaleString('en-IN')}</div>
                                        <button class="wa-btn" onclick="order('${i.name}')">
                                            <i class="ph-fill ph-whatsapp-logo" style="color:#25D366; font-size: 1.4rem;"></i> ORDER INQUIRY
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `;
                }).join('');
            }

            // 2. Update Management UI Components
            document.getElementById('pCatSelect').innerHTML = `<option value="">Select Category</option>` + cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            document.getElementById('catList').innerHTML = cats.map(c => `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #222;">${c.name} <i class="ph ph-trash" onclick="db.ref('categories/${c.id}').remove()" style="color:red; cursor:pointer;"></i></div>`).join('');
            document.getElementById('invList').innerHTML = prods.map(p => `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #222; align-items:center;"><span>${p.name} <small style="color:#444">(${p.cat})</small></span> <i class="ph ph-trash" onclick="db.ref('inventory/${p.id}').remove()" style="color:red; cursor:pointer;"></i></div>`).join('');
        }

        function saveCat() {
            const name = document.getElementById('catName').value;
            if(name) db.ref('categories').push({name}).then(() => document.getElementById('catName').value = '');
        }

        function saveProduct() {
            const file = document.getElementById('pImage').files[0];
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const cat = document.getElementById('pCatSelect').value;
            
            if(!file || !name || !price || !cat) return alert("Please fill all product details and select an image.");
            
            const reader = new FileReader();
            reader.onloadend = () => {
                db.ref('inventory').push({name, price, cat, img: reader.result})
                .then(() => { 
                    alert("Product Live on Home Page!"); 
                    document.getElementById('pName').value = ''; 
                    document.getElementById('pPrice').value = '';
                });
            };
            reader.readAsDataURL(file);
        }

        function filterStore() {
            const q = document.getElementById('mainSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(q) ? 'block' : 'none';
            });
        }

        function order(n) { 
            const msg = `Hi Vijay Electronics Mukerian, I'm interested in the ${n}. Is it available?`;
            window.open(`https://wa.me/919876898832?text=${encodeURIComponent(msg)}`, '_blank'); 
        }

        function openPortal() { if(prompt("Security PIN:") === "ig99") document.getElementById('portal').style.display = 'block'; }
        function closePortal() { document.getElementById('portal').style.display = 'none'; }
    </script>
</body>
</html>
