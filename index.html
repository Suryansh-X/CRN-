<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Electronics Mukerian | Premium Home Living</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #030303;
            --surface: #0a0a0c;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--accent); overflow-x: hidden; scroll-behavior: smooth; }

        /* Animated Background Flow */
        .ambient-engine {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at 50% 50%, #080808 0%, #000 100%);
        }
        .glow-blob {
            position: absolute; width: 65vw; height: 65vw;
            background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
            border-radius: 50%; animation: float 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }
        @keyframes float { 
            0% { transform: translate(-15%, -15%) scale(1); }
            100% { transform: translate(25%, 15%) scale(1.1); }
        }

        /* Navigation & Shining Silver Logo */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 18px 6%; background: rgba(3, 3, 3, 0.85);
            backdrop-filter: blur(30px); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { 
            font-weight: 800; font-size: 1.3rem; letter-spacing: -0.8px;
            background: linear-gradient(90deg, #444, #fff, #aaa, #fff, #444);
            background-size: 200% auto; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; animation: silverShine 4s linear infinite;
        }
        @keyframes silverShine { to { background-position: 200% center; } }

        .search-container { width: 35%; position: relative; }
        .search-container input {
            width: 100%; background: var(--glass); border: 1px solid var(--border);
            padding: 12px 20px 12px 48px; border-radius: 16px; color: #fff;
            transition: 0.4s; font-size: 0.9rem; outline: none;
        }
        .search-container input:focus { border-color: #777; background: rgba(255,255,255,0.07); }
        .search-container i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #555; font-size: 1.2rem; }

        /* Store Layout */
        main { padding: 130px 0 80px; }
        .section-block { margin-bottom: 80px; padding-left: 6%; animation: reveal 1s ease-out; }
        @keyframes reveal { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .section-title-wrap { display: flex; justify-content: space-between; align-items: center; padding-right: 6%; margin-bottom: 30px; }
        .section-title-wrap h2 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.8px; }
        .rail-nav { display: flex; gap: 12px; }
        .nav-dot { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .nav-dot:hover { background: #fff; color: #000; border-color: #fff; }

        .product-rail {
            display: flex; overflow-x: auto; gap: 28px; padding-bottom: 30px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .product-rail::-webkit-scrollbar { display: none; }

        /* Authentic Product Card */
        .item-card {
            min-width: 330px; max-width: 330px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 32px; padding: 28px;
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); position: relative;
        }
        .item-card:hover { transform: translateY(-12px); border-color: #555; box-shadow: var(--shadow); }
        
        .image-box {
            width: 100%; height: 240px; background: #000;
            border-radius: 24px; margin-bottom: 22px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .image-box img { max-width: 82%; max-height: 82%; object-fit: contain; transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .item-card:hover .image-box img { transform: scale(1.1); }

        .category-label { color: #555; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; display: block; }
        .item-card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 15px; color: #eee; }
        .price-display { font-size: 1.7rem; font-weight: 800; margin-bottom: 25px; }
        
        .order-action {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            background: var(--accent); color: #000; font-weight: 800;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .order-action:hover { opacity: 0.9; transform: scale(0.98); }

        /* Staff Shell */
        #management {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; padding: 80px 10%; display: none; overflow-y: auto;
        }
        .close-portal { position: absolute; top: 40px; right: 40px; font-size: 2rem; cursor: pointer; color: #444; }
        .close-portal:hover { color: #fff; }
        .entry-form { max-width: 550px; margin: 0 auto; }
        .entry-form input, .entry-form select { width: 100%; padding: 18px; margin-bottom: 16px; background: #0d0d0f; border: 1px solid #222; color: #fff; border-radius: 16px; outline: none; }
        .entry-form input:focus { border-color: #555; }
        .submit-btn { width: 100%; padding: 20px; background: #fff; color: #000; font-weight: 800; border-radius: 18px; border: none; cursor: pointer; transition: 0.3s; }

        /* Footing */
        footer { padding: 100px 6% 60px; text-align: center; border-top: 1px solid var(--border); }
        .signature { font-size: 0.85rem; font-weight: 800; letter-spacing: 4px; color: #333; text-transform: uppercase; margin-bottom: 10px; }

        @media (max-width: 768px) {
            .search-container { display: none; }
            .item-card { min-width: 290px; }
            .section-title-wrap h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-engine"><div class="glow-blob"></div></div>

    <nav>
        <div class="logo">VIJAY <span>ELECTRONICS</span></div>
        <div class="search-container">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="storeSearch" placeholder="Search brands or appliances..." onkeyup="runSearch()">
        </div>
        <button style="background:none; border:1px solid #222; color:#555; padding:10px 18px; border-radius:12px; font-weight:800; cursor:pointer; font-size: 0.7rem; letter-spacing: 1px;" onclick="unlockPortal()">STAFF ACCESS</button>
    </nav>

    <main id="dynamicCatalog">
        </main>

    <footer>
        <div class="signature">@vijayelectronicsonline</div>
        <p style="color: #1a1a1a; font-size: 0.75rem; font-weight: 600;">Authorized Retailer • Railway Road, Mukerian • Est. 1999</p>
    </footer>

    <div id="management">
        <i class="ph ph-x-circle close-portal" onclick="lockPortal()"></i>
        <div class="entry-form">
            <h1 style="margin-bottom: 45px; font-weight: 800; letter-spacing: -1px;">Live Inventory Manager</h1>
            <input type="text" id="itemName" placeholder="Product Model/Name">
            <select id="itemCat">
                <option value="Air Conditioners">Air Conditioners</option>
                <option value="Refrigerators">Refrigerators</option>
                <option value="Washing Machines">Washing Machines</option>
                <option value="LED Televisions">LED Televisions</option>
                <option value="Symphony Coolers">Symphony Coolers</option>
                <option value="Premium Geysers">Premium Geysers</option>
            </select>
            <input type="number" id="itemPrice" placeholder="Final Selling Price (₹)">
            <input type="file" id="itemFile" accept="image/*">
            <button class="submit-btn" onclick="pushToCloud()">UPDATE LIVE STOREFRONT</button>
            
            <div id="quickManage" style="margin-top: 60px;"></div>
        </div>
    </div>

    <script>
        // System Config
        const firebaseConfig = {
            apiKey: "AIzaSyAjhi25Q8urRDAS33nxMl3J3PCh8u8-b64",
            authDomain: "igelectrons.firebaseapp.com",
            projectId: "igelectrons",
            databaseURL: "https://igelectrons-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Immediate Visibility Layer (Local Cache)
        let masterData = JSON.parse(localStorage.getItem('vj_mukerian_cache')) || [];
        if (masterData.length > 0) buildStore(masterData);

        // Real-time Cloud Synchronization
        database.ref('inventory').on('value', snap => {
            const cloudVal = snap.val();
            masterData = [];
            for (let id in cloudVal) masterData.push({ id, ...cloudVal[id] });
            localStorage.setItem('vj_mukerian_cache', JSON.stringify(masterData));
            buildStore(masterData);
            refreshManager();
        });

        function buildStore(items) {
            const container = document.getElementById('dynamicCatalog');
            const groups = [...new Set(items.map(i => i.cat))];
            
            container.innerHTML = groups.map(cat => {
                const groupItems = items.filter(i => i.cat === cat);
                const safeId = cat.replace(/\s/g, '');
                return `
                    <section class="section-block">
                        <div class="section-title-wrap">
                            <h2>${cat}</h2>
                            <div class="rail-nav">
                                <div class="nav-dot" onclick="scrollRail('${safeId}', -400)"><i class="ph ph-caret-left"></i></div>
                                <div class="nav-dot" onclick="scrollRail('${safeId}', 400)"><i class="ph ph-caret-right"></i></div>
                            </div>
                        </div>
                        <div class="product-rail" id="rail-${safeId}">
                            ${groupItems.map(item => `
                                <div class="item-card">
                                    <div class="image-box"><img src="${item.img}"></div>
                                    <span class="category-label">${item.cat}</span>
                                    <h3>${item.name}</h3>
                                    <div class="price-display">₹${parseInt(item.price).toLocaleString('en-IN')}</div>
                                    <button class="order-action" onclick="sendWhatsApp('${item.name}')">
                                        <i class="ph-fill ph-whatsapp-logo" style="font-size: 1.4rem; color: #25D366;"></i> CHECK AVAILABILITY
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }).join('');
        }

        function scrollRail(id, val) {
            document.getElementById(`rail-${id}`).scrollBy({ left: val, behavior: 'smooth' });
        }

        function runSearch() {
            const q = document.getElementById('storeSearch').value.toLowerCase();
            const results = masterData.filter(i => i.name.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));
            buildStore(results);
        }

        function sendWhatsApp(name) {
            const text = `Hi Vijay Electronics Mukerian, I am interested in the ${name}. Is it available in stock?`;
            window.open(`https://wa.me/919876898832?text=${encodeURIComponent(text)}`, '_blank');
        }

        // Staff Logic
        function unlockPortal() { if(prompt("Security PIN:") === "ig99") document.getElementById('management').style.display = 'block'; }
        function lockPortal() { document.getElementById('management').style.display = 'none'; }

        function pushToCloud() {
            const file = document.getElementById('itemFile').files[0];
            if(!file) return alert("Please attach a product image.");
            
            const reader = new FileReader();
            reader.onloadend = () => {
                database.ref('inventory').push({
                    name: document.getElementById('itemName').value,
                    cat: document.getElementById('itemCat').value,
                    price: document.getElementById('itemPrice').value,
                    img: reader.result
                }).then(() => {
                    alert("Storefront Synchronized!");
                    document.getElementById('itemName').value = '';
                    document.getElementById('itemPrice').value = '';
                });
            };
            reader.readAsDataURL(file);
        }

        function refreshManager() {
            const list = document.getElementById('quickManage');
            list.innerHTML = masterData.map(i => `
                <div style="display:flex; justify-content:space-between; background:#0d0d0f; padding:15px; border-radius:14px; margin-bottom:12px; align-items:center; border: 1px solid #111;">
                    <span style="font-size:0.9rem; font-weight:600;">${i.name}</span>
                    <i class="ph ph-trash-simple" style="color:#ff4444; cursor:pointer; font-size: 1.2rem;" onclick="database.ref('inventory/${i.id}').remove()"></i>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
